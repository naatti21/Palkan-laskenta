name: Build and deploy Palkka staging

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGING_ORIGIN: https://palkka-staging.pages.dev
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run complete test suite
        run: npm test

      - name: Build staging assets for approved Pages origin
        run: npm run build:staging

      - name: Check package contents and origin
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, readdir, stat } from 'node:fs/promises';
          import path from 'node:path';
          const dir = '_staging';
          const meta = JSON.parse(await readFile(path.join(dir, 'build-info.json'), 'utf8'));
          assert.equal(meta.origin, process.env.STAGING_ORIGIN);
          assert.equal(meta.environment, 'staging');
          assert.equal(meta.commit, process.env.GITHUB_SHA);
          const html = await readFile(path.join(dir, 'index.html'), 'utf8');
          assert.match(html, /TESTIVERSIO/);
          assert.match(html, /staging-entry\.mjs/);
          const start = await readFile(path.join(dir, 'staging-entry.mjs'), 'utf8');
          assert.ok(start.includes(process.env.STAGING_ORIGIN));
          const sw = await readFile(path.join(dir, 'sw.js'), 'utf8');
          assert.match(sw, /palkka-staging-v/);
          assert.doesNotMatch(sw, /const CACHE_PREFIX = "palkka-pwa-v"/);
          for (const f of [
            'index.html', 'styles.css', 'app.js', 'parser.js', 'storage.js', 'model.js',
            'learning.js', 'pdf-reader.js', 'manifest.webmanifest', 'sw.js',
            'staging-entry.mjs', 'build-info.json', 'icon-192.png', 'icon-512.png',
            'vendor/pdfjs/pdf.min.mjs', 'vendor/pdfjs/pdf.worker.min.mjs'
          ]) {
            assert.ok((await stat(path.join(dir, f))).isFile(), 'missing asset: ' + f);
          }
          console.log('Staging package contents and exact origin verified:', meta);
          NODE

      - name: Archive tested staging build for fallback
        uses: actions/upload-artifact@v4
        with:
          name: palkka-staging-direct-upload
          path: _staging/
          if-no-files-found: error
          retention-days: 14

      # No Cloudflare token is ever stored in this repository.
      - name: Check whether Cloudflare publishing is authorized
        id: auth
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '### Cloudflare staging not deployed: configure both Actions secrets' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact Cloudflare Pages target and production branch
        if: steps.auth.outputs.enabled == 'true'
        id: target
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          account = os.environ['CF_ACCOUNT_ID']
          assert re.fullmatch(r'[a-fA-F0-9]{32}', account), 'Invalid Cloudflare account ID'
          url = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects/palkka-staging'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['CF_API_TOKEN']})
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)
          assert data.get('success') is True, 'Cloudflare target lookup failed'
          project = data['result']
          assert project['name'] == 'palkka-staging', 'Wrong Pages project'
          assert project['subdomain'] == 'palkka-staging.pages.dev', 'Wrong Pages domain'
          assert (project.get('source') or {}).get('type') not in ('github', 'gitlab'), 'Expected Direct Upload Pages'
          branch = project.get('production_branch')
          assert isinstance(branch, str) and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]*', branch), 'Invalid production branch'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf8') as output:
              output.write('production_branch=' + branch + '\n')
          print('Verified the exact staging project and its production branch.')
          PY

      - name: Deploy tested assets only to Palkka staging
        if: steps.auth.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _staging --project-name=palkka-staging --branch=${{ steps.target.outputs.production_branch }} --commit-hash=${{ github.sha }}

      - name: Verify production deployment with authenticated Cloudflare API
        if: steps.auth.outputs.enabled == 'true'
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_ORIGIN: https://palkka-staging.pages.dev
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ['GITHUB_SHA']
          base = ('https://api.cloudflare.com/client/v4/accounts/'
                  + os.environ['CF_ACCOUNT_ID'] + '/pages/projects/palkka-staging/deployments')
          url = base + '?env=production&per_page=1'
          last = 'No deployment found'
          for attempt in range(12):
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['CF_API_TOKEN'],
                  'Cache-Control': 'no-cache'
              })
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              assert payload.get('success') is True, 'Cloudflare deployment API error'
              deployments = payload.get('result') or []
              if deployments:
                  deployment = deployments[0]
                  commit = ((deployment.get('deployment_trigger') or {}).get('metadata') or {}).get('commit_hash')
                  status = (deployment.get('latest_stage') or {}).get('status')
                  environment = deployment.get('environment')
                  last = 'Latest production deployment: commit=' + str(commit) + ' status=' + str(status)
                  if commit == expected and environment == 'production' and status == 'success':
                      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf8') as report:
                          report.write('### Cloudflare production-branch staging deployment verified\n')
                          report.write('- Target project: palkka-staging\n')
                          report.write('- Target origin: ' + os.environ['STAGING_ORIGIN'] + '\n')
                          report.write('- Commit: ' + expected + '\n')
                          report.write('- Cloudflare deployment: ' + str(deployment.get('url')) + '\n')
                          report.write('- Browser availability: **not verified; HTTP 403 from GitHub runner previously**\n')
                          report.write('- Independent QA: **not performed**\n')
                      print('Cloudflare deployment API verified', expected)
                      break
              time.sleep(5)
          else:
              raise RuntimeError('Expected staging deployment not verified: ' + last)
          PY
