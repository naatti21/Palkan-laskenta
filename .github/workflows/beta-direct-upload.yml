name: Publish isolated Palkka Beta

on:
  push:
    branches: ["deploy/beta-compact-precision-20261106"]

permissions:
  contents: read
  actions: read

concurrency:
  group: palkka-beta-direct-upload
  cancel-in-progress: true

jobs:
  beta:
    if: github.ref == 'refs/heads/deploy/beta-compact-precision-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETA_ORIGIN: https://palkka-beta.pages.dev
    steps:
      - name: Check out exact beta branch commit
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Require successful complete Quality gate for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const ownerRepo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const branch = 'deploy/beta-compact-precision-20261106';
          const endpoint = 'https://api.github.com/repos/' + ownerRepo +
            '/actions/workflows/quality.yml/runs?branch=' +
            encodeURIComponent(branch) + '&head_sha=' + encodeURIComponent(sha) + '&per_page=30';
          const headers = {
            Authorization: 'Bearer ' + process.env.GH_TOKEN,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          for (let attempt = 0; attempt < 80; attempt++) {
            const response = await fetch(endpoint, { headers });
            if (!response.ok) throw new Error('Quality gate API HTTP ' + response.status);
            const body = await response.json();
            const runs = (body.workflow_runs || []).filter(run =>
              run.name === 'Quality gate' &&
              run.head_sha === sha &&
              run.head_branch === branch &&
              run.event === 'push');
            const successful = runs.find(run => run.status === 'completed' && run.conclusion === 'success');
            if (successful) {
              const jobsUrl = 'https://api.github.com/repos/' + ownerRepo +
                '/actions/runs/' + successful.id + '/jobs?per_page=100';
              const jobsResponse = await fetch(jobsUrl, { headers });
              if (!jobsResponse.ok) throw new Error('Quality gate jobs HTTP ' + jobsResponse.status);
              const jobData = await jobsResponse.json();
              const jobs = jobData.jobs || [];
              const required = ['logic-tests','browser-tests'];
              if (!required.every(name => jobs.some(j => j.name === name && j.conclusion === 'success')))
                throw new Error('Quality gate success missing mandatory unit/browser job result');
              console.log('Exact-SHA canonical Quality gate verified:', sha, successful.html_url);
              process.exit(0);
            }
            if (runs.some(run => run.status === 'completed' &&
              ['failure','cancelled','timed_out','action_required'].includes(run.conclusion)))
              throw new Error('Canonical Quality gate not successful for commit ' + sha);
            if (attempt % 6 === 0) console.log('Awaiting canonical Quality gate for', sha);
            await sleep(15000);
          }
          throw new Error('Canonical Quality gate did not complete within 20 minutes');
          NODE

      - name: Build exclusively for the beta origin
        run: npm run build:beta

      - name: Audit beta artifact and origin lock
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, stat } from 'node:fs/promises';
          const root = '_beta/';
          const info = JSON.parse(await readFile(root + 'build-info.json', 'utf8'));
          assert.equal(info.environment, 'beta');
          assert.equal(info.origin, process.env.BETA_ORIGIN);
          assert.equal(info.commit, process.env.GITHUB_SHA);
          const html = await readFile(root + 'index.html', 'utf8');
          assert.match(html, /Palkka BETA/);
          assert.match(html, /beta-entry\.mjs/);
          assert.match(html, /id="beta-tag"[^>]*>BETA<\/span>/);
          assert.doesNotMatch(html, /id="beta-banner"/);
          assert.match(html, /id="pdfInput"[^>]*type="file"[^>]*accept="application\/pdf"/);
          assert.doesNotMatch(html, /id="pdfInput"[^>]*disabled/);
          assert.match(html, /id="dashboardDetails"/);
          const entry = await readFile(root + 'beta-entry.mjs', 'utf8');
          assert.ok(entry.includes(process.env.BETA_ORIGIN));
          const sw = await readFile(root + 'sw.js', 'utf8');
          assert.match(sw, /palkka-beta-v/);
          assert.match(sw, /beta-entry\.mjs/);
          assert.match(sw, /beta-compact\.mjs/);
          assert.match(sw, /beta-ledger\.mjs/);
          assert.match(sw, /analytics\.js/);
          assert.match(sw, /insights\.js/);
          assert.match(sw, /insights-ui\.js/);
          assert.match(sw, /scenario-model\.js/);
          assert.match(sw, /scenario-ui\.js/);
          assert.doesNotMatch(sw, /palkka-staging-v/);
          const manifest = JSON.parse(await readFile(root + 'manifest.webmanifest', 'utf8'));
          assert.equal(manifest.short_name, 'Palkka BETA');
          for (const p of [
            'index.html', 'beta-entry.mjs', 'beta-compact.mjs', 'beta-ledger.mjs', 'taxcard-forecast.js', 'app.js', 'analytics.js', 'insights.js', 'insights-ui.js', 'scenario-model.js', 'scenario-ui.js', 'parser.js',
            'model.js', 'storage.js', 'learning.js', 'styles.css', 'sw.js',
            'manifest.webmanifest', 'build-info.json', '_headers', 'pdf-reader.js',
            'vendor/pdfjs/pdf.min.mjs', 'vendor/pdfjs/pdf.worker.min.mjs',
            'icon-192.png', 'icon-512.png'
          ]) assert.ok((await stat(root + p)).isFile(), 'Missing beta asset ' + p);
          const ab = await readFile(root + 'experiments/year-planner/ab-summary-v6.mjs', 'utf8');
          assert.match(ab, /betaWeekendsA/);
          assert.match(ab, /betaWeekendsB/);
          console.log('Beta artifact verified, source SHA:', info.commit);
          NODE

      - name: Retain exact beta build for rollback
        uses: actions/upload-artifact@v4
        with:
          name: palkka-beta-tested-build
          path: _beta/
          if-no-files-found: error
          retention-days: 14

      - name: Verify Cloudflare authorization
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo 'Missing Cloudflare token Actions secret'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing Cloudflare account Actions secret'; exit 1; }

      - name: Create or verify isolated Pages Direct Upload project
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request

          account = os.environ['CF_ACCOUNT_ID']
          assert re.fullmatch(r'[a-fA-F0-9]{32}', account), 'Invalid account ID'
          root = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects'
          headers = {'Authorization': 'Bearer ' + os.environ['CF_API_TOKEN'],
                     'Content-Type': 'application/json'}

          def call(method, url, data=None):
              body = json.dumps(data).encode('utf8') if data is not None else None
              req = urllib.request.Request(url, headers=headers, method=method, data=body)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              assert payload.get('success') is True, 'Cloudflare Pages request unsuccessful'
              return payload['result']

          try:
              project = call('GET', root + '/palkka-beta')
              print('Existing beta project found')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              project = call('POST', root, {'name': 'palkka-beta', 'production_branch': 'beta'})
              print('Created isolated beta Pages project')

          assert project.get('name') == 'palkka-beta', 'Incorrect Pages project'
          assert project.get('subdomain') == 'palkka-beta.pages.dev', 'Unexpected Pages origin'
          assert project.get('production_branch') == 'beta', 'Unexpected Pages production branch'
          assert (project.get('source') or {}).get('type') not in ('github', 'gitlab'), 'Refusing Git-connected project'
          print('Verified beta project, branch and exact origin')
          PY

      - name: Publish beta only, never staging or GitHub Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _beta --project-name=palkka-beta --branch=beta --commit-hash=${{ github.sha }}

      - name: Verify production deployment of the beta Pages project with authenticated API
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ['GITHUB_SHA']
          origin = os.environ['BETA_ORIGIN']
          url = ('https://api.cloudflare.com/client/v4/accounts/' +
                 os.environ['CF_ACCOUNT_ID'] + '/pages/projects/palkka-beta/deployments?env=production&per_page=1')
          headers = {'Authorization': 'Bearer ' + os.environ['CF_API_TOKEN'],
                     'Cache-Control': 'no-cache'}
          last = 'No deployment data'
          for i in range(12):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              assert payload.get('success'), 'Cloudflare deployments API error'
              deployments = payload.get('result') or []
              if deployments:
                  item = deployments[0]
                  commit = ((item.get('deployment_trigger') or {}).get('metadata') or {}).get('commit_hash')
                  state = (item.get('latest_stage') or {}).get('status')
                  env = item.get('environment')
                  last = f'commit={commit}, stage={state}, environment={env}'
                  if commit == expected and state == 'success' and env == 'production':
                      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf8') as f:
                          f.write('### Isolated Palkka BETA successfully deployed\\n')
                          f.write('- URL: ' + origin + '\\n- SHA: ' + expected + '\\n')
                          f.write('- Personal data: **not uploaded**\\n')
                          f.write('- Independent parser QA: **pending**\\n')
                      print('Beta Pages deployment verified:', expected)
                      break
              time.sleep(5)
          else:
              raise RuntimeError('Beta Pages deployment not verified: ' + last)
          PY
