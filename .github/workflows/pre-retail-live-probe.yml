name: Probe pre-retail live planner

on:
  pull_request:
    branches: ["pre-retail/v0.1-foundation-20261124"]

permissions:
  contents: read

jobs:
  live-planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Probe live mobile iframe and nested assets
        run: node scripts/probe-pre-retail-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-retail-live-planner-mobile
          path: pre-retail-live-mobile.png
          if-no-files-found: ignore
          retention-days: 7
