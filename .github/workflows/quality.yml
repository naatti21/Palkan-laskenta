name: Quality gate

on:
  push:
    branches: ["main", "develop", "deploy/beta-compact-precision-20261106"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit and scenario tests
        run: node --test tests/*.test.mjs

  browser-tests:
    # Playwright 1.57 supports Ubuntu 24.04; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Run isolated Beta integration tests
        if: success() || failure()
        run: npm run test:beta

      - name: Run staging isolation tests
        if: success() || failure()
        run: npm run test:staging

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload staging raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-results
          path: test-results/staging.json
          if-no-files-found: error
          retention-days: 14
