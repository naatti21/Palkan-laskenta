name: Palkka Pages

on:
  workflow_run:
    workflows: ["Quality gate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  resolve-green-ref:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Resolve last green commit
        id: ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="$(gh api               -H "Accept: application/vnd.github+json"               "/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?branch=main&status=success&per_page=1"               --jq '.workflow_runs[0].head_sha')"
          fi

          if [[ -z "${SHA}" || "${SHA}" == "null" ]]; then
            echo "No successful Quality gate commit found." >&2
            exit 1
          fi

          echo "Using green commit: ${SHA}"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: resolve-green-ref
    if: needs.resolve-green-ref.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout green commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-green-ref.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare local PDF.js runtime
        run: npm run prepare:pdfjs

      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/vendor/pdfjs
          cp index.html styles.css app.js parser.js model.js storage.js learning.js pdf-reader.js manifest.webmanifest sw.js icon-192.png icon-512.png _site/
          cp vendor/pdfjs/pdf.min.mjs vendor/pdfjs/pdf.worker.min.mjs _site/vendor/pdfjs/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
